<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amtscup Konolfingen 2027</title>
<style>:root{--b:#07101d;--p:#121d31;--p2:#192844;--l:#304464;--t:#f2f6ff;--m:#aebbd0;--a:#50b7ff;--g:#35c98a;--r:#ff8b8b}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#091426;color:var(--t)}header{padding:16px;position:sticky;top:0;background:#07101df5;border-bottom:1px solid var(--l);z-index:4}.wrap{max-width:1150px;margin:auto;padding:16px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{width:auto}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:18px;margin:14px 0}button,input,select{background:var(--p2);color:var(--t);border:1px solid var(--l);border-radius:10px;padding:10px;font-size:14px}button{font-weight:700;cursor:pointer}.primary{background:var(--a);color:#06111f}.ok{background:var(--g);color:#06111f}.danger{background:#5b2630}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{font-size:12px;color:var(--m)}label input,label select{display:block;width:100%;margin-top:5px}.shoot{display:grid;grid-template-columns:2fr .65fr .8fr 1fr .7fr;gap:7px;padding:9px 0;border-top:1px solid var(--l)}.status{background:var(--p2);padding:10px;border-radius:10px;margin:10px 0;color:var(--m)}.warn{color:#ffd166}.hide{display:none}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:left}.ranktabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.ranktabs button{width:auto}.adminrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.adminrow button{width:auto}@media(max-width:720px){.grid{grid-template-columns:1fr}.shoot{grid-template-columns:1fr 1fr}.shoot label:first-child{grid-column:1/-1}table{font-size:12px}}</style></head>
<body><header><b>Amtscup Konolfingen 2027 – Feld A Test</b><div class="tabs"><button onclick="show('capture')">📷 Standblatt</button><button onclick="show('rank')">🏆 Ranglisten</button><button onclick="show('admin')">⚙ Admin</button></div></header><main class="wrap">
<section id="capture"><div class="card"><h2>Standblatt erfassen</h2><input id="photo" type="file" accept="image/*" capture="environment"> <button id="analyse" class="primary">🤖 Mit KI auswerten</button><div id="ast" class="status">Foto wählen und auswerten.</div></div>
<div id="edit" class="card hide"><h2>Kontrolle vor Veröffentlichung</h2><div class="grid">
<label>Disziplin<select id="discipline"><option value="">Bitte wählen</option><option>Feld A</option><option>Pistole</option><option>Jungschützen</option></select></label>
<label>Runde<input id="round"></label><label>Kombination<input id="komb"></label><label>Gruppencode<input id="code"></label><label>Verein<input id="club"></label><label>Gruppenname<input id="groupName"></label></div>
<div id="shooters"></div><div id="warn" class="status warn"></div><button id="confirm" class="ok">✓ Kontrolliert & veröffentlichen</button><div id="cst" class="status">Noch nicht gespeichert.</div></div></section>
<section id="rank" class="hide"><div class="card"><h2>Ranglisten Feld A</h2><div class="ranktabs" id="ranktabs"></div><div id="rankbox"></div></div></section>
<section id="admin" class="hide"><div class="card"><h2>Admin – eingegangene Standblätter</h2><div class="status">Hier sind auch die gespeicherten Original-Datensätze sichtbar. Testeinträge können gelöscht werden.</div><div id="adminbox"></div></div></section>
</main><script>
const $=x=>document.getElementById(x), SPORTS=["90BK","90RK","57/03","57/02","Karabiner","Standard","FG"], BONUS={"90BK":4,"90RK":4,"57/03":4,"57/02":8,"Karabiner":4,"Standard":0,"FG":0};
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;")}
function show(x){["capture","rank","admin"].forEach(y=>$(y).classList.toggle("hide",x!==y));if(x==="rank")loadRank();if(x==="admin")loadAdmin()}
$("analyse").onclick=async()=>{let f=$("photo").files[0];if(!f)return $("ast").textContent="Bitte Foto wählen.";let fd=new FormData();fd.append("image",f);$("ast").textContent="KI wertet aus …";try{let r=await fetch("/api/analyse",{method:"POST",body:fd}),j=await r.json();if(!r.ok)throw Error(j.error);fill(j);$("ast").textContent="✓ Auswertung da – jetzt vollständig kontrollieren."}catch(e){$("ast").textContent="Fehler: "+e.message}};
function fill(j){$("edit").classList.remove("hide");["discipline","round","komb","code","club","groupName"].forEach(k=>$(k).value=j[k]||"");$("shooters").innerHTML="";
(j.shooters||[]).slice(0,5).forEach((s,i)=>$("shooters").insertAdjacentHTML("beforeend",`<div class="shoot"><label>${i+1}. Name<input class="nm" value="${esc(s.name)}"></label><label>JG<input class="jg" value="${esc(s.birthYear)}"></label><label>Gender<select class="gen"><option value="">wählen</option><option value="M" ${String(s.gender).toUpperCase().startsWith("M")?"selected":""}>M</option><option value="W" ${["W","F"].includes(String(s.gender).toUpperCase().charAt(0))?"selected":""}>W</option></select></label><label>Sport<select class="sp"><option value="">wählen</option>${SPORTS.map(x=>`<option ${x===s.sport?"selected":""}>${x}</option>`).join("")}</select></label><label>Resultat<input class="rs" type="number" value="${Number(s.result||0)}"></label></div>`));
while(document.querySelectorAll(".shoot").length<5){let i=document.querySelectorAll(".shoot").length;$("shooters").insertAdjacentHTML("beforeend",`<div class="shoot"><label>${i+1}. Name<input class="nm"></label><label>JG<input class="jg"></label><label>Gender<select class="gen"><option value="">wählen</option><option>M</option><option>W</option></select></label><label>Sport<select class="sp"><option value="">wählen</option>${SPORTS.map(x=>`<option>${x}</option>`).join("")}</select></label><label>Resultat<input class="rs" type="number"></label></div>`)}
$("warn").textContent=(j.warnings||[]).length?"⚠ KI-Warnungen: "+j.warnings.join(" · "):"Bitte trotzdem jedes Feld mit dem Standblatt vergleichen."}
$("confirm").onclick=async()=>{let shooters=[...document.querySelectorAll(".shoot")].map(d=>({name:d.querySelector(".nm").value.trim(),birthYear:d.querySelector(".jg").value.trim(),gender:d.querySelector(".gen").value,sport:d.querySelector(".sp").value,result:Number(d.querySelector(".rs").value||0)}));let missing=shooters.findIndex(s=>!s.name||!s.birthYear||!s.gender||!s.sport||!s.result);if($("discipline").value!=="Feld A")return $("cst").textContent="⛔ Für diesen Test muss Disziplin Feld A sein.";if(missing>=0)return $("cst").textContent=`⛔ Schütze ${missing+1} ist noch nicht vollständig kontrolliert.`;
let body={discipline:$("discipline").value,round:$("round").value.trim(),komb:$("komb").value.trim(),code:$("code").value.trim(),club:$("club").value.trim(),groupName:$("groupName").value.trim(),shooters};let r=await fetch("/api/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),j=await r.json();$("cst").textContent=r.ok?"✓ Gespeichert. Die Ranglisten sind jetzt neu berechnet.":"Fehler: "+j.error;}
function flat(subs){return subs.filter(s=>s.discipline==="Feld A").flatMap(s=>s.shooters.map(a=>({...a,round:s.round,komb:s.komb,code:s.code,club:s.club,groupName:s.groupName,bonus:BONUS[a.sport]||0,total:Number(a.result)+(BONUS[a.sport]||0)})))}
function ranked(rows){return rows.slice().sort((a,b)=>b.total-a.total||b.result-a.result||a.name.localeCompare(b.name,"de")).map((x,i)=>({...x,rank:i+1}))}
function single(title,rows){rows=ranked(rows);return `<h3>${esc(title)}</h3><div style="overflow:auto"><table><thead><tr><th>Rang</th><th>Name</th><th>Verein</th><th>Gruppe</th><th>JG</th><th>Gen</th><th>Sportg.</th><th>Resultat</th><th>Zuschlag</th><th>Total</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.name)}</td><td>${esc(r.club)}</td><td>${esc(r.groupName)}</td><td>${esc(r.birthYear)}</td><td>${r.gender}</td><td>${r.sport}</td><td>${r.result}</td><td>${r.bonus}</td><td><b>${r.total}</b></td></tr>`).join(""):`<tr><td colspan="10">Noch keine Resultate.</td></tr>`}</tbody></table></div>`}
function groups(rows){let m=new Map();rows.forEach(r=>{let k=[r.round,r.code,r.club,r.groupName,r.komb].join("|");if(!m.has(k))m.set(k,{...r,shoot:[]});m.get(k).shoot.push(r)});let g=[...m.values()].map(x=>{let s=ranked(x.shoot).slice(0,5);return {...x,result:s.reduce((z,a)=>z+a.result,0),bonus:s.reduce((z,a)=>z+a.bonus,0),total:s.reduce((z,a)=>z+a.total,0),high:Math.max(0,...s.map(a=>a.total))}});let pm=new Map();g.forEach(x=>{let n=Number((x.komb.match(/^\d+/)||["999"])[0]);x.pair=n;if(!pm.has(n))pm.set(n,[]);pm.get(n).push(x)});pm.forEach(a=>{a.sort((x,y)=>y.total-x.total||y.high-x.high);a.forEach((x,i)=>x.pairing=i===0?"GEW":"VER")});g.sort((a,b)=>a.pair-b.pair||(/Heim/i.test(a.komb)?-1:1));return `<h3>Gruppenrangliste</h3><div style="overflow:auto"><table><thead><tr><th>GrNr</th><th>Komb</th><th>Verein</th><th>GRName</th><th>Resultat</th><th>Zuschlag</th><th>Total</th><th>Hö.Passe</th><th>Paarung</th></tr></thead><tbody>${g.length?g.map(x=>`<tr><td>${x.code}</td><td>${x.komb}</td><td>${esc(x.club)}</td><td>${esc(x.groupName)}</td><td>${x.result}</td><td>${x.bonus}</td><td><b>${x.total}</b></td><td>${x.high}</td><td>${x.pairing}</td></tr>`).join(""):`<tr><td colspan="9">Noch keine Gruppen.</td></tr>`}</tbody></table></div>`}
async function loadRank(){let j=await (await fetch("/api/results")).json(),rows=flat(j.submissions), round=rows.length?[...new Set(rows.map(x=>x.round))].sort().at(-1):"";if(round)rows=rows.filter(x=>x.round===round);let reps=[["Gesamt",()=>single(`${round}. Runde Gesamtrangliste`,rows)],["Weiblich",()=>single(`${round}. Runde Weiblich`,rows.filter(x=>x.gender==="W"))],["Gruppen",()=>groups(rows)]];[...new Set(rows.map(x=>x.sport))].sort().forEach(s=>{reps.push([s,()=>single(`${s} ${round}. Runde`,rows.filter(x=>x.sport===s))]);if(rows.some(x=>x.sport===s&&x.gender==="W"))reps.push([s+" Weiblich",()=>single(`${s} ${round}. Runde – Weiblich`,rows.filter(x=>x.sport===s&&x.gender==="W"))])});$("ranktabs").innerHTML=reps.map((r,i)=>`<button data-i="${i}">${esc(r[0])}</button>`).join("");let open=i=>$("rankbox").innerHTML=reps[i][1]();$("ranktabs").querySelectorAll("button").forEach(b=>b.onclick=()=>open(Number(b.dataset.i)));open(0)}
async function loadAdmin(){let j=await (await fetch("/api/results")).json();$("adminbox").innerHTML=j.submissions.length?j.submissions.map(s=>`<div class="status adminrow"><span><b>${esc(s.code)} ${esc(s.groupName)}</b> · ${esc(s.club)} · Runde ${esc(s.round)} · ${esc(s.discipline)} · ${new Date(s.confirmedAt).toLocaleString("de-CH")}</span><button class="danger" onclick="del('${s.id}')">Löschen</button></div>`).join(""):"<div class='status'>Noch keine Standblätter gespeichert.</div>"}
async function del(id){if(!confirm("Diesen Test-Datensatz wirklich löschen?"))return;await fetch("/api/results/"+id,{method:"DELETE"});loadAdmin()}
</script></body></html>
