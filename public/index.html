<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amtscup Konolfingen 2027</title><style>
:root{--b:#07101d;--p:#121d31;--p2:#182640;--l:#2a3c5c;--t:#edf4ff;--m:#aab7ca;--a:#50b7ff;--g:#36c98a;--y:#ffd166}
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(#07101d,#0d1830);color:var(--t)}header{padding:18px 20px;border-bottom:1px solid var(--l);position:sticky;top:0;background:#07101df2;z-index:3}
.wrap{max-width:1000px;margin:auto;padding:16px}.tabs{display:flex;gap:8px}.tabs button{width:auto}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:17px;margin:14px 0}button,input,select{border:1px solid var(--l);border-radius:11px;background:var(--p2);color:var(--t);padding:11px;font-size:14px}button{cursor:pointer;font-weight:700}.primary{background:var(--a);color:#06111f}.ok{background:var(--g);color:#06111f}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{color:var(--m);font-size:12px}label input,label select{display:block;width:100%;margin-top:5px}.shoot{display:grid;grid-template-columns:2fr .7fr .8fr .8fr .7fr;gap:8px;border-top:1px solid var(--l);padding:10px 0}.status{padding:11px;border-radius:10px;background:var(--p2);margin-top:10px;color:var(--m)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--l)}.hide{display:none}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--p2);color:var(--m)}
@media(max-width:700px){.grid{grid-template-columns:1fr}.shoot{grid-template-columns:1fr 1fr}.shoot label:first-child{grid-column:1/-1}table{font-size:12px}}
</style></head><body><header><b>Amtscup Konolfingen 2027 – Prototyp</b><div class="tabs"><button onclick="show('capture')">📷 Standblatt</button><button onclick="show('rank')">🏆 Rangliste</button></div></header>
<div class="wrap">
<section id="capture"><div class="card"><h2>Standblatt erfassen</h2><input id="photo" type="file" accept="image/*" capture="environment"><button class="primary" id="analyse">🤖 Mit KI auswerten</button><div id="ast" class="status">Foto wählen und auswerten.</div></div>
<div id="edit" class="card hide"><h2>Kontrolle</h2><div class="grid">
<label>Disziplin<input id="discipline"></label><label>Runde<input id="round"></label><label>Kombination<input id="komb"></label><label>Gruppencode<input id="code"></label><label>Verein<input id="club"></label><label>Gruppenname<input id="groupName"></label></div>
<div id="shooters"></div><div id="warn" class="status"></div><button class="ok" id="confirm">✓ Kontrolliert & veröffentlichen</button><div id="cst" class="status">Noch nicht gespeichert.</div></div></section>
<section id="rank" class="hide"><div class="card"><h2>Live-Rangliste Feld A</h2><div class="status">Testjahr 2027 – startet ohne Resultate. Bestätigte Standblätter erscheinen hier.</div><div style="overflow:auto"><table><thead><tr><th>Rang</th><th>Gruppe</th><th>Verein</th><th>Runde</th><th>Komb</th><th>Total</th></tr></thead><tbody id="tbody"></tbody></table></div></div></section>
</div><script>
let current=null; const $=id=>document.getElementById(id);
function show(x){$("capture").classList.toggle("hide",x!=="capture");$("rank").classList.toggle("hide",x!=="rank");if(x==="rank")loadRank()}
$("analyse").onclick=async()=>{const f=$("photo").files[0];if(!f){$("ast").textContent="Bitte zuerst ein Foto wählen.";return} $("ast").textContent="KI wertet aus …";let fd=new FormData();fd.append("image",f);
try{let r=await fetch("/api/analyse",{method:"POST",body:fd}),j=await r.json();if(!r.ok)throw Error(j.error||"Fehler");current=j;fill(j);$("ast").textContent="✓ Auswertung da – bitte kontrollieren."}catch(e){$("ast").textContent="Fehler: "+e.message}}
function fill(j){$("edit").classList.remove("hide");["discipline","round","komb","code","club","groupName"].forEach(k=>$(k).value=j[k]||"");$("warn").textContent=(j.warnings||[]).length?"⚠ "+j.warnings.join(" · "):"Keine Warnungen der KI.";$("shooters").innerHTML="";
(j.shooters||[]).forEach((s,i)=>{$("shooters").insertAdjacentHTML("beforeend",`<div class="shoot"><label>${i+1}. Name<input class="nm" value="${esc(s.name)}"></label><label>JG<input class="jg" value="${esc(s.birthYear)}"></label><label>Gen<input class="gen" value="${esc(s.gender)}"></label><label>Sport<input class="sp" value="${esc(s.sport)}"></label><label>Resultat<input class="rs" type="number" value="${Number(s.result||0)}"></label></div>`)});}
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")}
$("confirm").onclick=async()=>{let shooters=[...document.querySelectorAll(".shoot")].map(d=>({name:d.querySelector(".nm").value,birthYear:d.querySelector(".jg").value,gender:d.querySelector(".gen").value,sport:d.querySelector(".sp").value,result:Number(d.querySelector(".rs").value||0)}));
let body={discipline:$("discipline").value,round:$("round").value,komb:$("komb").value,code:$("code").value,club:$("club").value,groupName:$("groupName").value,shooters};
let r=await fetch("/api/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),j=await r.json();$("cst").textContent=r.ok?"✓ Gespeichert und für die Rangliste veröffentlicht.":"Fehler: "+(j.error||"Speichern fehlgeschlagen");if(r.ok)loadRank();}
async function loadRank(){let j=await (await fetch("/api/results")).json();let groups=(j.submissions||[]).filter(x=>x.discipline==="Feld A").map(x=>({...x,total:(x.shooters||[]).slice().sort((a,b)=>b.result-a.result).slice(0,5).reduce((s,a)=>s+Number(a.result||0),0)})).sort((a,b)=>b.total-a.total);
$("tbody").innerHTML=groups.length?groups.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.code)} ${esc(g.groupName)}</td><td>${esc(g.club)}</td><td>${esc(g.round)}</td><td>${esc(g.komb)}</td><td><b>${g.total}</b></td></tr>`).join(""):`<tr><td colspan="6">Noch keine bestätigten Standblätter.</td></tr>`}
loadRank();
</script></body></html>
