<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amtscup 2027</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#081426;color:#f4f7fb}header{background:#07101d;border-bottom:1px solid #31435f;padding:14px;position:sticky;top:0}.wrap{max-width:1100px;margin:auto;padding:16px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.card{background:#121d31;border:1px solid #31435f;border-radius:16px;padding:18px;margin:14px 0}button,input,select{background:#192844;color:#fff;border:1px solid #3a4e70;border-radius:9px;padding:10px}button{font-weight:bold;cursor:pointer}.primary{background:#50b7ff;color:#06111f}.ok{background:#35c98a;color:#06111f}.danger{background:#682b34}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:12px;color:#b9c5d8}label input,label select{display:block;width:100%;margin-top:5px}.pair{display:grid;grid-template-columns:70px 1fr 1fr auto;gap:10px;align-items:end;border-top:1px solid #30425e;padding:12px 0}.result{background:#1a2943;border-radius:10px;padding:10px;margin-top:6px}.hide{display:none}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #30425e;text-align:left}@media(max-width:720px){.grid,.pair{grid-template-columns:1fr}.wrap{padding:10px}}</style></head>
<body><header><b>Amtscup Konolfingen 2027 – V3</b><div class="tabs"><button onclick="show('groups')">👥 Gruppenstamm</button><button onclick="show('registered')">✅ Anmeldungen 2027</button><button onclick="show('draw')">🎟 Auslosung</button><button onclick="show('sheets')">📄 Standblätter</button></div></header><main class="wrap">
<section id="groups"><div class="card"><h2>Gruppenstamm</h2><p>Alle bekannten Gruppen und die Kontaktdaten des Gruppenchefs.</p><div class="grid"><label>Disziplin<select id="gd"><option>Feld A</option><option>Pistole</option><option>Jungschützen</option></select></label><label>Gruppennummer<input id="gc" placeholder="A055"></label><label>Verein<input id="gv"></label><label>Gruppenname<input id="gn"></label><label>Gruppenchef<input id="gl" placeholder="Name Vorname"></label><label>E-Mail<input id="ge" type="email"></label><label>Telefon<input id="gt"></label><label>Natel<input id="gm"></label></div><p><button class="ok" onclick="saveGroup()">Gruppe speichern</button></p><div id="gcount"></div><div id="gtable"></div></div></section>
<section id="registered" class="hide"><div class="card"><h2>Anmeldungen 2027</h2><label>Disziplin<select id="rd" onchange="renderRegistered()"><option>Feld A</option><option>Pistole</option><option>Jungschützen</option></select></label><div id="rcount"></div><div id="rtable"></div></div></section>
<section id="draw" class="hide"><div class="card"><h2>Auslosung</h2><p>Das Los wird wie bisher von Hand gezogen. Hier wird nur die gezogene Gruppennummer eingegeben.</p><div class="grid"><label>Disziplin<select id="dd"><option>Feld A</option><option>Pistole</option><option>Jungschützen</option></select></label><label>Runde<input id="dr" type="number" min="1" value="1"></label><label>Kombination<input id="dp" type="number" min="1" value="1"></label></div><div class="pair"><label>Heim-Los<input id="home" placeholder="z.B. A055" oninput="lookup('home','homeInfo')"></label><div id="homeInfo" class="result">Noch kein Heim-Los.</div><label>Gast-Los<input id="guest" placeholder="z.B. A053" oninput="lookup('guest','guestInfo')"></label><div id="guestInfo" class="result">Noch kein Gast-Los.</div></div><button class="primary" onclick="saveDraw()">Paarung bestätigen</button><div id="dst"></div></div></section>
<section id="sheets" class="hide"><div class="card"><h2>Auslosung & Standblätter</h2><div id="drawlist"></div></div></section>
</main><script>
let state={groups:[],draws:[]};const $=x=>document.getElementById(x),esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;");
async function load(){state=await (await fetch("/api/state")).json();renderGroups();renderDraws()}
function show(id){["groups","registered","draw","sheets"].forEach(x=>$(x).classList.toggle("hide",x!==id));if(id==="sheets")renderDraws();if(id==="registered")renderRegistered()}
function renderGroups(){let d=$("gd").value,a=state.groups.filter(x=>x.discipline===d).sort((a,b)=>a.code.localeCompare(b.code)),n=a.filter(x=>x.registered2027).length;$("gcount").innerHTML=`<p><b>${a.length}</b> Gruppen im Stamm · <b>${n}</b> für 2027 angemeldet</p>`;$("gtable").innerHTML=`<table><tr><th>Nr.</th><th>Verein / Gruppe</th><th>Gruppenchef</th><th>Kontakt</th><th>2027</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.club)}<br>${esc(x.name)}</td><td>${esc(x.leader||"–")}</td><td>${esc(x.email||"–")}<br>${esc(x.phone||"")} ${esc(x.mobile||"")}</td><td>${x.registered2027?"✅ angemeldet":"–"}</td><td><button class="${x.registered2027?"danger":"ok"}" onclick="setReg('${x.discipline}','${x.code}',${!x.registered2027})">${x.registered2027?"Abmelden":"Für 2027 anmelden"}</button> <button onclick="editGroup('${x.discipline}','${x.code}')">Bearbeiten</button></td></tr>`).join("")}</table>`}
function renderRegistered(){let d=$("rd").value,a=state.groups.filter(x=>x.discipline===d&&x.registered2027).sort((a,b)=>a.code.localeCompare(b.code));$("rcount").innerHTML=`<p><b>${a.length}</b> angemeldete Gruppen ${d}</p>`;$("rtable").innerHTML=a.length?`<table><tr><th>Nr.</th><th>Verein</th><th>Gruppe</th><th>Gruppenchef</th><th>E-Mail</th><th>Natel</th></tr>${a.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.club)}</td><td>${esc(x.name)}</td><td>${esc(x.leader||"–")}</td><td>${esc(x.email||"–")}</td><td>${esc(x.mobile||"–")}</td></tr>`).join("")}</table>`:"Noch keine Gruppen für 2027 angemeldet."}
async function setReg(d,c,v){await fetch(`/api/groups/${encodeURIComponent(d)}/${encodeURIComponent(c)}/register`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({registered:v})});await load();renderRegistered()}
function editGroup(d,c){let g=state.groups.find(x=>x.discipline===d&&x.code===c);if(!g)return;$("gd").value=g.discipline;$("gc").value=g.code;$("gv").value=g.club;$("gn").value=g.name;$("gl").value=g.leader||"";$("ge").value=g.email||"";$("gt").value=g.phone||"";$("gm").value=g.mobile||"";window.scrollTo({top:0,behavior:"smooth"})}
$("gd").onchange=renderGroups;
async function saveGroup(){let old=state.groups.find(x=>x.discipline===$("gd").value&&x.code===$("gc").value.trim().toUpperCase());let body={discipline:$("gd").value,code:$("gc").value.trim().toUpperCase(),club:$("gv").value.trim(),name:$("gn").value.trim(),leader:$("gl").value.trim(),email:$("ge").value.trim(),phone:$("gt").value.trim(),mobile:$("gm").value.trim(),registered2027:old?.registered2027||false};let r=await fetch("/api/groups",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)return alert((await r.json()).error);$("gc").value=$("gv").value=$("gn").value=$("gl").value=$("ge").value=$("gt").value=$("gm").value="";await load()}
function find(code){return state.groups.find(x=>x.discipline===$("dd").value&&x.code===String(code).trim().toUpperCase()&&x.registered2027)}
function lookup(inp,out){let g=find($(inp).value);$(out).innerHTML=g?`<b>${esc(g.code)}</b><br>${esc(g.club)}<br>${esc(g.name)}`:"Nicht für 2027 angemeldet oder Gruppe nicht gefunden."}
async function saveDraw(){let h=find($("home").value),g=find($("guest").value);if(!h||!g)return $("dst").textContent="⛔ Heim oder Gast nicht gefunden.";let body={discipline:$("dd").value,round:$("dr").value,pairNo:$("dp").value,home:h.code,guest:g.code};let r=await fetch("/api/draws",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)return $("dst").textContent="⛔ "+j.error;$("dst").textContent=`✓ Kombination ${body.pairNo} gespeichert.`;$("dp").value=Number($("dp").value)+1;$("home").value=$("guest").value="";$("homeInfo").textContent="Noch kein Heim-Los.";$("guestInfo").textContent="Noch kein Gast-Los.";await load()}
function renderDraws(){let a=state.draws.slice().sort((x,y)=>x.discipline.localeCompare(y.discipline)||Number(x.round)-Number(y.round)||Number(x.pairNo)-Number(y.pairNo));$("drawlist").innerHTML=a.length?a.map(x=>{let h=state.groups.find(g=>g.discipline===x.discipline&&g.code===x.home),v=state.groups.find(g=>g.discipline===x.discipline&&g.code===x.guest);let base=`/api/standblatt/${encodeURIComponent(x.discipline)}/${x.round}/${x.pairNo}`;return `<div class="card"><b>${esc(x.discipline)} · Runde ${x.round} · Kombination ${x.pairNo}</b><p>🏠 ${esc(h?.code)} – ${esc(h?.club)} – ${esc(h?.name)}<br>🚌 ${esc(v?.code)} – ${esc(v?.club)} – ${esc(v?.name)}</p><button onclick="window.open('${base}/home.pdf')">PDF Heim</button> <button onclick="window.open('${base}/guest.pdf')">PDF Gast</button> <button class="danger" onclick="delDraw('${x.id}')">Löschen</button></div>`}).join(""):"Noch keine Paarungen erfasst."}
async function delDraw(id){if(!confirm("Paarung wirklich löschen?"))return;await fetch("/api/draws/"+id,{method:"DELETE"});await load()}
$("dd").onchange=()=>{lookup("home","homeInfo");lookup("guest","guestInfo")};load();
</script></body></html>
